<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queens Cargo | Worldwide Express, Freight &amp; Secure Cargo</title>
    <meta name="description" content="Queens Cargo moves express parcels, freight, vehicles and high-value cargo worldwide, with one tracking ID, live milestones and signed proof of delivery." />
    <link rel="canonical" href="https://queenscargo.com/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=6" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png?v=6" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#181818" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Queens Cargo" />
    <meta property="og:url" content="https://queenscargo.com/" />
    <meta property="og:title" content="Queens Cargo: Faster Moves. Bigger Reach." />
    <meta property="og:description" content="Queens Cargo moves express parcels, freight, vehicles and high-value cargo worldwide, with one tracking ID, live milestones and signed proof of delivery." />
    <meta property="og:image" content="https://queenscargo.com/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Queens Cargo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Queens Cargo: Faster Moves. Bigger Reach." />
    <meta name="twitter:description" content="Queens Cargo moves express parcels, freight, vehicles and high-value cargo worldwide, with one tracking ID, live milestones and signed proof of delivery." />
    <meta name="twitter:image" content="https://queenscargo.com/brand/og-image.jpg" />
    <meta name="twitter:image:alt" content="Queens Cargo" />

    <!-- Organization structured data. Only confirmed facts (CLAUDE.md §2); add telephone, address and
         sameAs (social profiles) here once the owner supplies them. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://queenscargo.com/#organization",
        "name": "Queens Cargo",
        "legalName": "Queens Cargo",
        "url": "https://queenscargo.com/",
        "logo": "https://queenscargo.com/brand/mark.png",
        "image": "https://queenscargo.com/brand/og-image.jpg",
        "email": "info@queenscargo.com",
        "slogan": "Faster Moves. Bigger Reach.",
        "description": "Queens Cargo moves express parcels, freight, vehicles and high-value cargo worldwide, with one tracking ID, live milestones and signed proof of delivery.",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "info@queenscargo.com",
          "areaServed": "Worldwide"
        }
      }
    </script>

    <!-- Fonts are self-hosted (src/styles/fonts.ts) and bundled with the main stylesheet. -->

    <!-- Home hero (the largest paint on the landing page), fetched before the app script runs. Same
         sources, sizes and breakpoint as ResponsiveImage in HomePage.tsx, so it is not downloaded twice. -->
    <link rel="preload" as="image" type="image/webp" media="(max-width: 767px)" fetchpriority="high" imagesizes="100vw"
          imagesrcset="/images/site/hero-home-mobile-640.webp 640w, /images/site/hero-home-mobile-1024.webp 1024w, /images/site/hero-home-mobile-1290.webp 1290w">
    <link rel="preload" as="image" type="image/webp" media="(min-width: 768px)" fetchpriority="high" imagesizes="100vw"
          imagesrcset="/images/site/hero-home-640.webp 640w, /images/site/hero-home-1024.webp 1024w, /images/site/hero-home-1600.webp 1600w, /images/site/hero-home-2400.webp 2400w">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>Powered by <a href="https://coretexcoregroup.com" target="_blank" rel="noopener">Coretex Core Group</a></noscript>
  </body>
</html>
